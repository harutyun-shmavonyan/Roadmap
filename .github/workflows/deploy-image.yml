name: build and push image

# Railway pulls h317280/roadmap-app:latest; it does not build from git. This job is the "docker build && docker push"
# from CLAUDE.md, run on GitHub's runners: on every push to main that touches the app, or by hand for a branch.
# After it finishes, redeploy the Railway service (dashboard, or the Railway MCP `redeploy` tool) so it re-pulls.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "Dockerfile", ".dockerignore"]

concurrency:
  group: roadmap-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            h317280/roadmap-app:latest
            h317280/roadmap-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "Pushed h317280/roadmap-app:latest (${{ github.sha }}). Now redeploy the Railway service so it re-pulls." >> "$GITHUB_STEP_SUMMARY"
