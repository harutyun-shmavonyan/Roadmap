name: storage test

# End-to-end test of file storage (bucket vs the legacy bytea columns): builds the backend, runs it
# against Postgres and an S3 emulator (moto), and checks backfill, reads, writes, sweeping and that nothing
# is served from Postgres any more (.github/storage-test/run.py). Also generates an EF migration
# when the model has changes no migration covers, and commits it back to the branch — the remote
# Claude sessions have no .NET SDK, so this is where `dotnet ef` runs for them.
on:
  workflow_dispatch:
  push:
    branches-ignore: [master]
    paths: ["backend/**", ".github/storage-test/**", ".github/workflows/storage-test.yml"]
  pull_request:
    paths: ["backend/**", ".github/storage-test/**"]

permissions:
  contents: write

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roadmap
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate a migration if the model has uncovered changes
        working-directory: backend
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.11
          dotnet restore
          dotnet build -c Debug --no-restore -v q
          if ! dotnet ef migrations has-pending-model-changes --no-build; then
            name="${MIGRATION_NAME:-BlobStorageKeys}"
            dotnet ef migrations add "$name" --no-build
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Migrations
            git commit -m "Add EF migration $name (generated by the storage test workflow)"
            if [ "${{ github.event_name }}" != "pull_request" ]; then git push; fi
            echo "Generated migration $name and committed it." >> "$GITHUB_STEP_SUMMARY"
          fi
          # The model and the migrations must agree before anything else runs.
          dotnet build -c Debug --no-restore -v q
          dotnet ef migrations has-pending-model-changes

      - name: Build
        working-directory: backend
        run: dotnet publish -c Release -o ../out

      - name: Start an S3 emulator (moto)
        run: |
          pip install "moto[server]" boto3 >/dev/null
          nohup moto_server -H 127.0.0.1 -p 9000 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/ >/dev/null && exit 0; sleep 1; done
          cat moto.log; exit 1

      - name: Run the end-to-end storage test
        run: |
          sudo apt-get install -y postgresql-client >/dev/null 2>&1 || true
          python3 .github/storage-test/run.py out/Roadmap.Api.dll

      - name: App logs
        if: always()
        run: for f in app-*.log; do [ -f "$f" ] && { echo "=== $f"; tail -n 200 "$f"; }; done; true
